# https://github.com/marketplace/actions/publish-docker

name: Publish to Docker
on:
  push:
  pull_request:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:

jobs:
  prepare-target-buster:
    name: "List perl versions [buster]"
    runs-on: ubuntu-latest
    outputs:
      perl-versions: ${{ steps.action.outputs.perl-versions }}
    steps:
      - id: action
        name: Perl versions action step
        uses: perl-actions/perl-versions@v2
        with:
          target:     'perl-buster'
          since-perl: '5.8'
          with-devel: 'false'

  prepare-target-bookworm:
    name: "List perl versions [bookworm]"
    runs-on: ubuntu-latest
    outputs:
      perl-versions: ${{ steps.action.outputs.perl-versions }}
    steps:
      - id: action
        name: Perl versions action step
        uses: perl-actions/perl-versions@v2
        with:
          target:     'perl-bookworm'
          since-perl: '5.8'
          with-devel: 'false'

  prepare-target-trixie:
    name: "List perl versions [trixie]"
    runs-on: ubuntu-latest
    outputs:
      perl-versions: ${{ steps.action.outputs.perl-versions }}
    steps:
      - id: action
        name: Perl versions action step
        uses: perl-actions/perl-versions@v2
        with:
          target:     'perl-trixie'
          since-perl: '5.8'
          with-devel: 'false'

  prepare-matrix:
    name:               "Prepare matrix"
    runs-on:            ubuntu-latest
    needs:
      - prepare-target-buster
      - prepare-target-bookworm
      - prepare-target-trixie
    outputs:
      matrix:           ${{ steps.action.outputs.matrix }}
    steps:
      - uses:           actions/checkout@v6
      - id:             action
        name:           "Perl versions action step"
        uses:           ./.github/actions/build-matrix
        with:
          buster:       ${{ needs.prepare-target-buster.outputs.perl-versions }}
          bookworm:     ${{ needs.prepare-target-bookworm.outputs.perl-versions }}
          trixie:       ${{ needs.prepare-target-trixie.outputs.perl-versions }}

  latest-build:
    name: "Build latest"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian-version: [buster,slim-bookworm,slim-trixie]

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-docker
        with:
          hub-password: ${{ secrets.DOCKER_GITHUB_TOKEN }}
          hub-username: ${{ secrets.DOCKER_USERNAME }}
          base:         ${{ matrix.debian-version }}
          tags:         "latest,${{ matrix.debian-version }}"

  devel-build:
    name: "Build devel"
    runs-on: ubuntu-latest

    steps:
      - uses:           actions/checkout@v7
      - uses:           ./.github/actions/publish-docker
        with:
          hub-username: ${{ secrets.DOCKER_USERNAME }}
          hub-password: ${{ secrets.DOCKER_GITHUB_TOKEN }}
          base:         devel-slim-bookworm
          tags:         "devel,devel-slim-bookworm"

  build:
    name:               "Build and publish docker images"
    runs-on:            ubuntu-latest
    needs:
      - prepare-matrix

    strategy:
      fail-fast:        false
      matrix:           ${{ fromJSON (needs.prepare-matrix.outputs.matrix) }}

    steps:
      - uses:           actions/checkout@v7
      - name:           "Build and Publish to Registry: ${{ matrix.base }} => ${{ matrix.tags }}"
        uses:           ./.github/actions/publish-docker
        with:
          hub-username: ${{ secrets.DOCKER_USERNAME }}
          hub-password: ${{ secrets.DOCKER_GITHUB_TOKEN }}
          base:         ${{ matrix.base }}
          tags:         ${{ matrix.tags }}
