# https://github.com/marketplace/actions/publish-docker

name: Publish to Docker
on:
  push:
  pull_request:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:

jobs:
  # buster images do not exist for 5.42 and newer.
  prepare-matrix-buster:
    runs-on: ubuntu-latest
    name: "List perl versions [buster]"
    outputs:
      perl-versions: ${{ steps.action.outputs.perl-versions }}
    steps:
      - name: Perl versions action step
        id: action
        uses: perl-actions/perl-versions@v2.0
        with:
          since-perl: '5.8'
          until-perl: '5.40'
          with-devel: 'false'

  # bookworm base images only exist for 5.36 and newer.
  # use default tags for 5.36 and newer
  prepare-matrix-bookworm-extra:
    runs-on: ubuntu-latest
    name: "List perl versions [bookworm]"
    outputs:
      perl-versions: ${{ steps.action.outputs.perl-versions }}
    steps:
      - name: Perl versions action step
        id: action
        uses: perl-actions/perl-versions@v2.0
        with:
          since-perl: '5.36'
          until-perl: '5.40'
          with-devel: 'false'

  # Similar to the `matrix-bookworm` job, but also add the default tag like `5.42` to the list
  prepare-matrix-bookworm-defaults:
    runs-on: ubuntu-latest
    name: "List perl versions [bookworm defaults]"
    outputs:
      perl-versions: ${{ steps.action.outputs.perl-versions }}
    steps:
      - name: Perl versions action step
        id: action
        uses: perl-actions/perl-versions@v2.0
        with:
          since-perl: '5.42'
          with-devel: 'false'

  # Similar to the `matrix-bookworm` job, but also add the default tag like `5.42` to the list
  prepare-matrix-trixie-defaults:
    runs-on: ubuntu-latest
    name: "List perl versions [trixie defaults]"
    outputs:
      perl-versions: ${{ steps.action.outputs.perl-versions }}
    steps:
      - name: Perl versions action step
        id: action
        uses: perl-actions/perl-versions@v2.0
        with:
          since-perl: '5.40'
          with-devel: 'false'

  latest-build:
    name: "Build latest"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian-version: [buster,slim-bookworm,slim-trixie]

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-docker
        with:
          hub-password: ${{ secrets.DOCKER_GITHUB_TOKEN }}
          hub-username: ${{ secrets.DOCKER_USERNAME }}
          buildargs:    BASE=${{ matrix.debian-version }}
          tags:         "latest,${{ matrix.debian-version }}"

  devel-build:
    name: "Build latest"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-docker
        with:
          hub-username: ${{ secrets.DOCKER_USERNAME }}
          hub-password: ${{ secrets.DOCKER_GITHUB_TOKEN }}
          buildargs:    BASE=devel-slim-bookworm
          tags:         "devel,devel-slim-bookworm"

  build-buster:
    name: "Build versions for buster"
    runs-on: ubuntu-latest
    needs:
      - prepare-matrix-buster

    strategy:
      fail-fast: false
      matrix:
        perl-version: ${{ fromJson (needs.prepare-matrix-buster.outputs.perl-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-docker
        with:
          hub-username: ${{ secrets.DOCKER_USERNAME }}
          hub-password: ${{ secrets.DOCKER_GITHUB_TOKEN }}
          buildargs:    BASE=${{ matrix.perl-version }}-buster
          tags:         "${{ matrix.perl-version }}-buster,${{ matrix.perl-version }}"

  build-bookworm-extra:
    name: "Build bookworm extra versions"
    runs-on: ubuntu-latest
    needs: prepare-matrix-bookworm-extra
    strategy:
      fail-fast: false
      matrix:
        perl-version: ${{ fromJson(needs.prepare-matrix-bookworm-extra.outputs.perl-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-docker
        with:
          hub-username: ${{ secrets.DOCKER_USERNAME }}
          hub-password: ${{ secrets.DOCKER_GITHUB_TOKEN }}
          buildargs:    BASE=${{ matrix.perl-version }}-slim-bookworm
          tags:         ${{ matrix.perl-version }}-slim-bookworm

  build-bookworm-defaults:
    name: "Build bookworm default versions"
    runs-on: ubuntu-latest
    needs: prepare-matrix-bookworm-defaults
    strategy:
      fail-fast: false
      matrix:
        perl-version: ${{ fromJson(needs.prepare-matrix-bookworm-defaults.outputs.perl-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-docker
        with:
          hub-username: ${{ secrets.DOCKER_USERNAME }}
          hub-password: ${{ secrets.DOCKER_GITHUB_TOKEN }}
          buildargs:    BASE=${{ matrix.perl-version }}-slim-bookworm
          tags:         ${{ matrix.perl-version }}-slim-bookworm,${{ matrix.perl-version }}

  build-trixie-defaults:
      name: "Build trixie default versions"
      runs-on: ubuntu-latest
      needs: prepare-matrix-trixie-defaults
      strategy:
        fail-fast: false
        matrix:
          perl-version: ${{ fromJson(needs.prepare-matrix-trixie-defaults.outputs.perl-versions) }}
      steps:
        - uses: actions/checkout@v7
        - uses: ./.github/actions/publish-docker
          with:
            hub-username: ${{ secrets.DOCKER_USERNAME }}
            hub-password: ${{ secrets.DOCKER_GITHUB_TOKEN }}
            buildargs:    BASE=${{ matrix.perl-version }}-slim-trixie
            tags:         ${{ matrix.perl-version }}-slim-trixie,${{ matrix.perl-version }}

